# Local development stack:  docker compose up --build
# Host ports 8010/8510 (8000/8501 are taken by another local stack); inside
# the compose network the services keep their native ports.
services:
  backend:
    build: .
    ports:
      - "8010:8000"
    environment:
      # required on every write endpoint (POST/PATCH/DELETE); read from .env
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-token}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - app_data:/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8510:8501"
    environment:
      API_BASE: http://backend:8000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-token}
      # chat panel: GitHub Models free tier (optional second provider)
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Gemini via Vertex AI (the VM's service account authenticates; no key file)
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      VERTEX_PROJECT: ${VERTEX_PROJECT:-}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-central1}
      VERTEX_MODEL: ${VERTEX_MODEL:-gemini-2.5-flash-lite}
      CHAT_LIMIT_PER_USER_DAY: ${CHAT_LIMIT_PER_USER_DAY:-20}
      CHAT_LIMIT_GLOBAL_DAY: ${CHAT_LIMIT_GLOBAL_DAY:-300}
    depends_on:
      - backend

volumes:
  app_data:
