# One identity per component. No pod calls the Kubernetes API, so no token is mounted.
# On GKE, gridcast-ui alone is granted Vertex AI through Workload Identity (the chat runs in
# the UI process); the API and the job triggers get no Google permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gridcast-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gridcast-ui
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gridcast-cron
automountServiceAccountToken: false
