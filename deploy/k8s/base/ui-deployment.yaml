# The Streamlit UI: stateless apart from per-session memory and the in-process chat limiter.
# Rolling updates are safe (a new pod is ready before an old one stops). Readiness does not
# depend on the API: the UI already renders its own backend-down page.
# Resources from measurements: 204 MiB steady, 247 MiB peak, ~8 mCPU average.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gridcast-ui
  labels:
    app.kubernetes.io/name: gridcast
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: gridcast
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gridcast
        app.kubernetes.io/component: ui
    spec:
      serviceAccountName: gridcast-ui
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: gridcast-ui
          ports:
            - name: http
              containerPort: 8501
          envFrom:
            - configMapRef:
                name: gridcast-config
          env:
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gridcast-admin
                  key: ADMIN_TOKEN
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
