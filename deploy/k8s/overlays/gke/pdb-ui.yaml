# Keep one of the two UI pods during node upgrades. Deliberately none for the API: a budget
# of minAvailable 1 on a single-replica Deployment would block node drains indefinitely.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gridcast-ui
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gridcast
      app.kubernetes.io/component: ui
